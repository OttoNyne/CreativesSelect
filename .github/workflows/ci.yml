name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` first, so this also type-checks the test files —
      # the same command Vercel runs, so a failure here would fail a deploy.
      - run: npm run build
      - run: npm test
      # Fails the build on known high/critical vulnerabilities in dependencies.
      - run: npm audit --audit-level=high
